name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and auto-fix structure
        run: |
          set -e
          mkdir -p extracted
          unzip -o source.zip -d extracted || unzip -o *.zip -d extracted
          # Tự động tìm thư mục chứa settings.gradle
          PROJECT_DIR=$(find extracted -name "settings.gradle" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Không tìm thấy settings.gradle - kiểm tra lại file zip"
            find extracted -type f | head -50
            exit 1
          fi
          echo "Tìm thấy project tại: $PROJECT_DIR"
          # Di chuyển toàn bộ nội dung ra thư mục gốc
          shopt -s dotglob
          mv "$PROJECT_DIR"/* . 2>/dev/null || true
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Verify structure
        run: |
          echo "=== Files ở gốc ==="
          ls -la
          echo "=== settings.gradle ==="
          cat settings.gradle || echo "KHÔNG CÓ settings.gradle"
          echo "=== app/build.gradle ==="
          cat app/build.gradle || echo "KHÔNG CÓ app/build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
